      <stop offset="0" stop-color="#163f6b"/>
      <stop offset="45%" stop-color="#0d2a4a"/>
      <stop offset="100%" stop-color="#0a1f38"/>
    </radialGradient>
    <linearGradient id="ogShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5288"/>
